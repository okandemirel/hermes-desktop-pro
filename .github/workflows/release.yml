name: Release Hermes Desktop Pro

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify (typecheck · lint · test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  release:
    name: Build & publish (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Serialize so the three platforms append assets to one release without
      # racing on its creation.
      max-parallel: 1
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No Apple Developer certificate: build macOS UNSIGNED. Squirrel.Mac auto-
      # update needs a signed + notarized build, so the app falls back to notify-
      # and-download on macOS (see src/main/app-updater.ts). Linux (AppImage) and
      # Windows publish auto-updatable artifacts.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Package & publish
        run: npx electron-builder --publish always
